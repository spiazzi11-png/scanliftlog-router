<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ScanLiftLog</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root { --b:#111; --g:#666; --bg:#f6f7fb; --card:#fff; --line:#e6e8f0; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--b); }
    .wrap { max-width: 860px; margin: 36px auto; padding: 0 16px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 14px; }
    .brand { font-weight: 800; letter-spacing:.2px; font-size: 18px; }
    .tag { display:inline-block; font-size: 12px; border:1px solid var(--line); background:#fff; padding: 6px 10px; border-radius: 999px; color: var(--g); }
    .card { background:var(--card); border:1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.05); padding: 18px; }
    .grid { display:grid; grid-template-columns: 1fr; gap:12px; }
    @media (min-width: 860px){ .grid { grid-template-columns: 1.2fr .8fr; } }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 12px; color: var(--g); line-height: 1.5; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    label { font-size: 12px; color: var(--g); display:block; margin: 0 0 4px; }
    input, select, button, textarea {
      font: inherit;
      border:1px solid var(--line);
      border-radius: 10px;
      padding: 10px 10px;
      background:#fff;
      color: var(--b);
    }
    input, select { min-width: 160px; }
    button { cursor:pointer; font-weight: 700; }
    button.primary { background:#111; color:#fff; border-color:#111; }
    button.danger { background:#fff; color:#b00020; border-color:#f0c9d1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background:#f1f3f8; padding: 10px; border-radius: 10px; border:1px solid var(--line); overflow:auto; }
    .hr { height:1px; background: var(--line); margin: 14px 0; }
    .list { display:flex; flex-direction:column; gap:10px; }
    .item { border:1px solid var(--line); border-radius: 12px; padding: 12px; background:#fff; }
    .item .meta { font-size: 12px; color: var(--g); margin-top: 6px; }
    .small { font-size: 12px; color: var(--g); margin-top: 10px; }
    .warn { color:#8a5a00; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">ScanLiftLog</div>
      <div class="tag" id="contextTag">Loading…</div>
    </div>

    <div class="grid">
      <!-- LEFT: Logging -->
      <div class="card">
        <h1 id="machineTitle">Choose a machine</h1>
        <p id="machineSubtitle">Scan a QR code on a machine to load its log screen automatically.</p>

        <div class="row">
          <div>
            <label for="machineInput">Machine ID</label>
            <input id="machineInput" placeholder="e.g., legpr" />
          </div>

          <div>
            <label for="exerciseInput">Exercise</label>
            <input id="exerciseInput" placeholder="Optional note (e.g., Leg Press)" />
          </div>

          <div>
            <label for="weightInput">Weight</label>
            <input id="weightInput" inputmode="decimal" placeholder="e.g., 270" />
          </div>

          <div>
            <label for="repsInput">Reps</label>
            <input id="repsInput" inputmode="numeric" placeholder="e.g., 10" />
          </div>

          <div style="align-self:flex-end;">
            <button class="primary" id="saveBtn">Save Set</button>
          </div>
        </div>

        <div class="small">
          Supports both formats:
          <div class="mono" style="margin-top:8px;">
            Old:  ?machine=LEGPR<br/>
            New:  /m/legpr  (from your router redirect)
          </div>
        </div>

        <div class="hr"></div>

        <div class="row">
          <button id="shareBtn">Copy QR Test Link</button>
          <button class="danger" id="clearBtn">Clear This Machine</button>
        </div>

        <div class="small warn" id="statusLine"></div>
      </div>

      <!-- RIGHT: History -->
      <div class="card">
        <h1 style="margin-bottom:10px;">History</h1>
        <div id="history" class="list"></div>
        <div class="small" id="historyFoot"></div>
      </div>
    </div>
  </div>

  <script>
    /**
     * ScanLiftLog (Gym App)
     * Paste this SAME file into both index.html and 404.html in your gym repo.
     *
     * Why: GitHub Pages returns 404 for deep links like /m/legpr unless you provide a 404.html fallback.
     * This is a typical “SPA on GitHub Pages” approach.
     */

    // ---- Config (for your current test gym) ----
    // This gymId is only used for the "Copy QR Test Link" helper button.
    // Your router controls real gym routing; this can remain "main" for now.
    const DEFAULT_GYM_SLUG = "main";

    // ---- Helpers ----
    const $ = (id) => document.getElementById(id);

    function normalizeSlug(v) {
      return String(v || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9-]/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function getMachineFromUrl() {
      const url = new URL(window.location.href);

      // 1) Query param support (old)
      let m = url.searchParams.get("machine");
      if (m) return normalizeSlug(m);

      // 2) Path support (new): /m/<machineId>
      const parts = url.pathname.split("/").filter(Boolean);
      const mIndex = parts.indexOf("m");
      if (mIndex !== -1 && parts[mIndex + 1]) return normalizeSlug(parts[mIndex + 1]);

      return "";
    }

    function setMachineInUrl(machineId) {
      const m = normalizeSlug(machineId);
      const url = new URL(window.location.href);

      // We will standardize on path form: /m/<machineId>
      // Keep it simple: if you're hosted at /scanliftlog/ on GitHub Pages, preserve that base path.
      // Example base path on GH Pages: /scanliftlog/
      // This script lives at that base, so we keep the first segment as the repo name when present.
      const parts = url.pathname.split("/").filter(Boolean);
      const repoBase = parts.length ? parts[0] : ""; // "scanliftlog" (repo name) on GH Pages

      const newPath = repoBase ? `/${repoBase}/m/${m}` : `/m/${m}`;
      url.pathname = newPath;

      // Remove old query param if present
      url.searchParams.delete("machine");

      window.history.replaceState({}, "", url.toString());
    }

    function storageKey(machineId) {
      return `scanliftlog:machine:${normalizeSlug(machineId)}:sets`;
    }

    function readSets(machineId) {
      try {
        const raw = localStorage.getItem(storageKey(machineId));
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function writeSets(machineId, sets) {
      localStorage.setItem(storageKey(machineId), JSON.stringify(sets));
    }

    function nowIso() {
      const d = new Date();
      return d.toISOString();
    }

    function prettyTime(iso) {
      try {
        return new Date(iso).toLocaleString();
      } catch {
        return iso;
      }
    }

    function renderHistory(machineId) {
      const container = $("history");
      container.innerHTML = "";

      if (!machineId) {
        $("historyFoot").textContent = "Scan a machine QR code to view history.";
        return;
      }

      const sets = readSets(machineId);

      if (!sets.length) {
        $("historyFoot").textContent = "No sets saved for this machine yet.";
        return;
      }

      $("historyFoot").textContent = `Saved sets: ${sets.length}`;

      // newest first
      sets.slice().reverse().forEach(s => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div><strong>${escapeHtml(s.exercise || machineId.toUpperCase())}</strong></div>
          <div class="meta">${escapeHtml(String(s.weight || ""))} lb × ${escapeHtml(String(s.reps || ""))} reps</div>
          <div class="meta">${escapeHtml(prettyTime(s.ts))}</div>
        `;
        container.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setContextTag(machineId) {
      const host = window.location.host;
      if (!machineId) {
        $("contextTag").textContent = `${host} · no machine`;
      } else {
        $("contextTag").textContent = `${host} · machine: ${machineId}`;
      }
    }

    function setMachineUI(machineId) {
      if (!machineId) {
        $("machineTitle").textContent = "Choose a machine";
        $("machineSubtitle").textContent = "Scan a QR code on a machine to load its log screen automatically.";
        $("statusLine").textContent = "";
        return;
      }

      $("machineTitle").textContent = `Machine: ${machineId.toUpperCase()}`;
      $("machineSubtitle").textContent = "Log your sets below. Data is stored on this device only.";
      $("statusLine").textContent = "";
    }

    function copyToClipboard(text) {
      return navigator.clipboard.writeText(text);
    }

    // ---- Main ----
    (function main() {
      // Initialize machine from URL
      let machineId = getMachineFromUrl();

      // Populate input fields
      $("machineInput").value = machineId || "";

      setContextTag(machineId);
      setMachineUI(machineId);
      renderHistory(machineId);

      // Save set
      $("saveBtn").addEventListener("click", () => {
        const m = normalizeSlug($("machineInput").value);
        const exercise = $("exerciseInput").value.trim();
        const weight = $("weightInput").value.trim();
        const reps = $("repsInput").value.trim();

        if (!m) {
          $("statusLine").textContent = "Enter a machine ID (or scan a QR code) before saving.";
          return;
        }

        if (!weight || !reps) {
          $("statusLine").textContent = "Enter both weight and reps.";
          return;
        }

        // Update URL to match machine if user typed it in
        if (m !== machineId) {
          machineId = m;
          setMachineInUrl(machineId);
        }

        const sets = readSets(machineId);
        sets.push({
          ts: nowIso(),
          machine: machineId,
          exercise: exercise,
          weight: weight,
          reps: reps
        });
        writeSets(machineId, sets);

        $("statusLine").textContent = "Saved.";
        $("weightInput").value = "";
        $("repsInput").value = "";

        setContextTag(machineId);
        setMachineUI(machineId);
        renderHistory(machineId);
      });

      // Clear machine
      $("clearBtn").addEventListener("click", () => {
        const m = normalizeSlug($("machineInput").value || machineId);
        if (!m) return;

        const ok = confirm(`Clear all saved sets for machine "${m}" on this device?`);
        if (!ok) return;

        localStorage.removeItem(storageKey(m));
        $("statusLine").textContent = "Cleared.";
        renderHistory(m);
      });

      // Copy test QR link (router link)
      $("shareBtn").addEventListener("click", async () => {
        const m = normalizeSlug($("machineInput").value || machineId);
        if (!m) {
          $("statusLine").textContent = "Enter a machine ID first.";
          return;
        }

        const url = `https://scanliftlog.com/g/${DEFAULT_GYM_SLUG}/m/${m}`;
        try {
          await copyToClipboard(url);
          $("statusLine").textContent = `Copied: ${url}`;
        } catch {
          $("statusLine").textContent = `Copy failed. Use this link: ${url}`;
        }
      });
    })();
  </script>
</body>
</html>
